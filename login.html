
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Al Noor Islamic Academy</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
 --gold:#e8cb78;--gold-deep:#d4af37;--ink:#04120d;
 --green:#0b2a20;--green2:#123d2d;--muted:#b8c9c0;
 --line:rgba(232,203,120,.28)
}
html{min-height:100%;background:#04120d}
body{
 min-height:100vh;display:flex;justify-content:center;align-items:center;
 padding:24px 18px;font-family:Arial,sans-serif;color:#f8f7f0;
 background:
  radial-gradient(ellipse at 15% 8%,rgba(37,119,78,.27),transparent 34%),
  radial-gradient(ellipse at 90% 85%,rgba(196,153,57,.12),transparent 32%),
  linear-gradient(145deg,#030d09 0%,#071e15 52%,#0a2b1e 100%);
}
.login-box{
 width:100%;max-width:430px;position:relative;isolation:isolate;overflow:hidden;
 padding:clamp(28px,6vw,42px) clamp(22px,6vw,36px);
 border-radius:28px;border:1px solid rgba(232,203,120,.34);
 background:linear-gradient(145deg,rgba(15,55,40,.97),rgba(6,29,20,.98));
 box-shadow:0 28px 75px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.07);
 text-align:center
}
.login-box:before{
 content:"";position:absolute;z-index:-1;width:230px;height:230px;right:-105px;top:-125px;
 border-radius:50%;background:radial-gradient(circle,rgba(232,203,120,.17),transparent 70%);
 box-shadow:0 0 0 24px rgba(232,203,120,.025),0 0 0 50px rgba(232,203,120,.018)
}
.login-box:after{
 content:"";position:absolute;z-index:-1;left:0;right:0;top:0;height:4px;
 background:linear-gradient(90deg,#9b7423,#f6e4a0,#bd963b)
}
.logo{
 width:78px;height:78px;margin:0 auto 22px;display:flex;align-items:center;justify-content:center;
 border-radius:24px;transform:rotate(-4deg);
 background:linear-gradient(145deg,#ffedb0,#c69a38);color:#10251a;
 border:1px solid rgba(255,244,199,.8);font-size:24px;font-weight:800;
 box-shadow:0 0 0 7px rgba(212,175,55,.08),0 12px 28px rgba(0,0,0,.28)
}
h1{
 color:var(--gold);font-family:Georgia,"Times New Roman",serif;
 font-size:clamp(27px,6vw,32px);letter-spacing:-.3px;margin-bottom:9px
}
.subtitle{color:#bdcec4;font-size:14px;line-height:1.65;margin-bottom:30px}
.input-group{text-align:left;margin-bottom:19px}
label{display:block;margin-bottom:9px;color:#e6e9e2;font-size:13px;font-weight:700;letter-spacing:.25px}
input{
 width:100%;padding:15px 16px;border:1px solid rgba(175,205,188,.25);
 border-radius:13px;background:rgba(3,19,13,.68);color:#fff;font-size:15px;
 outline:none;transition:border-color .2s,box-shadow .2s,background .2s
}
input::placeholder{color:#82978b}
input:focus{
 border-color:var(--gold);background:rgba(3,19,13,.9);
 box-shadow:0 0 0 4px rgba(212,175,55,.11)
}
.login-button{
 width:100%;padding:15px;margin-top:7px;border:1px solid rgba(255,238,174,.65);
 border-radius:13px;background:linear-gradient(135deg,#f1d987,#c69a35);
 color:#102319;font-size:16px;font-weight:800;letter-spacing:.25px;cursor:pointer;
 box-shadow:0 10px 24px rgba(0,0,0,.23);transition:transform .2s,filter .2s,box-shadow .2s
}
.login-button:hover{filter:brightness(1.06);transform:translateY(-2px);box-shadow:0 14px 28px rgba(0,0,0,.3)}
.login-button:active{transform:scale(.985)}
.login-button:disabled{opacity:.6;cursor:wait;transform:none}
.message{
 display:none;margin-top:17px;padding:13px 14px;border-radius:12px;
 background:rgba(118,47,39,.25);border:1px solid rgba(235,133,112,.35);
 color:#ffd5cb;font-size:13px;line-height:1.55;text-align:left
}
.forgot{display:block;margin-top:19px;color:var(--gold);text-decoration:none;font-size:13px}
.forgot:hover{text-decoration:underline}
.signup{margin-top:27px;color:#b4c3ba;font-size:14px;line-height:1.6}
.signup a{color:var(--gold);text-decoration:none;font-weight:700}
.signup a:hover{text-decoration:underline}
.home{display:inline-block;margin-top:21px;color:#aabbb0;text-decoration:none;font-size:13px}
.home:hover{color:var(--gold)}
a:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
@media(max-width:420px){
 body{padding:18px 14px}
 .login-box{border-radius:23px;padding:30px 21px}
 .logo{width:70px;height:70px;border-radius:21px}
 .subtitle{margin-bottom:25px}
}
@media(prefers-reduced-motion:reduce){
 *,*:before,*:after{transition:none!important}
}
</style>
</head>

<body>

<div class="login-box">

    <div class="logo">AN</div>

    <h1>Welcome Back</h1>

    <p class="subtitle">
        Login to Al Noor Islamic Academy
    </p>

    <form id="loginForm">

        <div class="input-group">
            <label>Email Address</label>
            <input
                id="email"
                type="email"
                placeholder="Enter your registered email"
                autocomplete="email"
                required>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input
                id="password"
                type="password"
                placeholder="Enter password"
                autocomplete="current-password"
                required>
        </div>

        <button
            type="submit"
            class="login-button"
            id="loginButton">
            Login
        </button>

    </form>

    <!-- Forgot Password -->
    <a href="#" class="forgot" id="forgotPassword">
        Forgot Password?
    </a>

    <div id="message" class="message"></div>

    <div class="signup">
        Don't have an account?
        <a href="signup.html">Create Account</a>
    </div>

    <a href="index.html" class="home">
        ← Back to Home
    </a>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    sendPasswordResetEmail
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


const firebaseConfig = {
    apiKey: "AIzaSyBvugRPCyDcq0gJsE_eUsaoVExi5Rc614k",
    authDomain: "al-noor-islamic-academy.firebaseapp.com",
    projectId: "al-noor-islamic-academy",
    storageBucket: "al-noor-islamic-academy.firebasestorage.app",
    messagingSenderId: "571799539455",
    appId: "1:571799539455:web:d42728685908430296c6ca"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const loginForm = document.getElementById("loginForm");
const loginButton = document.getElementById("loginButton");
const message = document.getElementById("message");

function showMessage(text) {
    message.style.display = "block";
    message.style.background = "rgba(118,47,39,.25)";
    message.style.borderColor = "rgba(235,133,112,.35)";
    message.style.color = "#ffd5cb";
    message.textContent = text;
}


// Login System
loginForm.addEventListener("submit", async (e) => {

    e.preventDefault();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    message.style.display = "none";

    loginButton.disabled = true;
    loginButton.textContent = "Logging in...";

    try {

        const credential =
            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );

        const user = credential.user;

        window.location.href = "dashboard.html";

    } catch (error) {

        console.error(error);

        if (error.code === "auth/invalid-credential" ||
            error.code === "auth/wrong-password" ||
            error.code === "auth/user-not-found") {

            showMessage(
                "Incorrect email or password. Please check your registered email and password."
            );

        } else if (error.code === "auth/invalid-email") {

            showMessage(
                "Please enter a valid email address."
            );

        } else if (error.code === "auth/too-many-requests") {

            showMessage(
                "Too many login attempts. Please wait a while and try again."
            );

        } else {

            showMessage(
                "Login failed. Please try again."
            );
        }

        loginButton.disabled = false;
        loginButton.textContent = "Login";
    }
});


// Forgot Password System
document.getElementById("forgotPassword").addEventListener("click", async (e) => {

    e.preventDefault();

    const email =
        document.getElementById("email").value.trim();

    if (!email) {
        showMessage(
            "Please enter your registered email address first."
        );
        document.getElementById("email").focus();
        return;
    }

    try {

        message.style.display = "none";

        await sendPasswordResetEmail(auth, email);

        message.style.display = "block";
        message.style.background = "rgba(30,100,65,.25)";
        message.style.borderColor = "rgba(100,210,140,.35)";
        message.style.color = "#c9f7d9";

        message.textContent =
            "Password reset link has been sent to your email. Please check your inbox.";

    } catch (error) {

        console.error("Password Reset Error:", error);

        if (error.code === "auth/invalid-email") {
            showMessage("Please enter a valid email address.");
        } else if (error.code === "auth/too-many-requests") {
            showMessage("Too many requests. Please wait and try again later.");
        } else {
            showMessage(
                "Unable to send reset email. Please check your email address and try again."
            );
        }
    }
});

</script>

</body>
</html>
