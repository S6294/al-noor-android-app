<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Al Noor Islamic Academy</title>

    <style>
        :root {
            --bg: #061713;
            --surface: rgba(12, 41, 35, 0.94);
            --surface-soft: #0a211c;
            --gold: #d8b64c;
            --gold-light: #f3dc91;
            --text: #f7f8f5;
            --muted: #a7b8b0;
            --border: rgba(216, 182, 76, 0.24);
            --focus: rgba(216, 182, 76, 0.18);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 32px 18px;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(ellipse at 15% 10%, rgba(28, 92, 69, 0.28), transparent 38%),
                radial-gradient(ellipse at 90% 85%, rgba(168, 132, 43, 0.12), transparent 34%),
                linear-gradient(145deg, #04110e 0%, #071f19 52%, #061713 100%);
            color: var(--text);
        }

        .signup-box {
            position: relative;
            overflow: hidden;
            width: 100%;
            max-width: 440px;
            background: linear-gradient(160deg, rgba(15, 48, 40, 0.98), rgba(8, 30, 25, 0.98));
            padding: 38px 30px 32px;
            border-radius: 24px;
            border: 1px solid var(--border);
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.48), inset 0 1px 0 rgba(255,255,255,0.045);
        }

        .signup-box::before {
            content: "";
            position: absolute;
            top: 0;
            left: 12%;
            right: 12%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            opacity: 0.8;
        }

        .logo {
            width: 78px;
            height: 78px;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 23px;
            background: linear-gradient(145deg, #f1d77f, #c49a2e);
            color: #071a17;
            font-size: 25px;
            font-weight: 800;
            letter-spacing: 1px;
            box-shadow: 0 9px 25px rgba(212, 175, 55, 0.2), inset 0 1px 0 rgba(255,255,255,0.45);
            transform: rotate(-3deg);
        }

        h1 {
            text-align: center;
            color: var(--gold-light);
            font-size: 29px;
            letter-spacing: 0.2px;
            margin-bottom: 9px;
        }

        .subtitle {
            text-align: center;
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .input-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            color: #e2e9e4;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: 0.2px;
        }

        input,
        select {
            width: 100%;
            min-height: 49px;
            padding: 13px 15px;
            background: rgba(3, 18, 14, 0.72);
            color: var(--text);
            border: 1px solid #35594e;
            border-radius: 11px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        input::placeholder {
            color: #71877d;
        }

        input:focus,
        select:focus {
            border-color: var(--gold);
            background: #071d17;
            box-shadow: 0 0 0 4px var(--focus);
        }

        select option {
            background: #071a17;
            color: white;
        }

        .signup-button {
            width: 100%;
            min-height: 51px;
            padding: 14px;
            margin-top: 10px;
            border: 1px solid rgba(255, 235, 169, 0.35);
            border-radius: 12px;
            background: linear-gradient(135deg, #f0d47a 0%, #d4af37 52%, #bd9228 100%);
            color: #071a17;
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 0.2px;
            cursor: pointer;
            box-shadow: 0 9px 22px rgba(212, 175, 55, 0.17);
            transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
        }

        .signup-button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 13px 28px rgba(212, 175, 55, 0.25);
            filter: brightness(1.04);
        }

        .signup-button:active:not(:disabled) {
            transform: translateY(0);
        }

        .signup-button:disabled {
            opacity: 0.62;
            cursor: not-allowed;
            box-shadow: none;
        }

        .login-text {
            text-align: center;
            margin-top: 25px;
            color: var(--muted);
            font-size: 14px;
        }

        .login-text a {
            color: var(--gold-light);
            text-decoration: none;
            font-weight: bold;
            margin-left: 3px;
        }

        .login-text a:hover,
        .home:hover {
            color: white;
            text-decoration: underline;
        }

        .home {
            display: block;
            text-align: center;
            margin-top: 21px;
            color: #91a69b;
            text-decoration: none;
            font-size: 13px;
            transition: color 0.2s ease;
        }

        @media (max-width: 480px) {
            body {
                padding: 18px 13px;
                align-items: flex-start;
            }

            .signup-box {
                margin: auto 0;
                padding: 32px 21px 27px;
                border-radius: 20px;
            }

            h1 {
                font-size: 26px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>
    <div class="signup-box">
        <div class="logo">AN</div>

        <h1>Create Account</h1>

        <p class="subtitle">
            Join Al Noor Islamic Academy
        </p>

        <form id="signupForm">
            <div class="input-group">
                <label>Full Name</label>
                <input
                    id="name"
                    type="text"
                    placeholder="Enter your full name"
                    required>
            </div>

            <div class="input-group">
                <label>Email Address</label>
                <input
                    id="email"
                    type="email"
                    placeholder="Enter your email"
                    required>
            </div>

            <div class="input-group">
                <label>Mobile Number</label>
                <input
                    id="mobile"
                    type="tel"
                    placeholder="Enter mobile number"
                    required>
            </div>

            <div class="input-group">
                <label>Password</label>
                <input
                    id="password"
                    type="password"
                    placeholder="Create password"
                    minlength="6"
                    required>
            </div>

            <div class="input-group">
                <label>Confirm Password</label>
                <input
                    id="confirmPassword"
                    type="password"
                    placeholder="Confirm password"
                    minlength="6"
                    required>
            </div>

            <div class="input-group">
                <label for="language">Preferred Language *</label>
                <select id="language" name="language" required>
                    <option value="" disabled selected>Select your language</option>
                    <option value="Bengali">বাংলা (Bengali)</option>
                    <option value="Urdu">اردو (Urdu)</option>
                </select>
            </div>

            <button
                type="submit"
                class="signup-button"
                id="signupButton">
                Create Account
            </button>
        </form>

        <div class="login-text">
            Already have an account?
            <a href="login.html">Login</a>
        </div>

        <a href="index.html" class="home">
            ← Back to Home
        </a>
    </div>

    <script type="module">
        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

        import {
            getAuth,
            createUserWithEmailAndPassword,
            updateProfile
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

        import {
            getFirestore,
            doc,
            setDoc,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBvugRPCyDcq0gJsE_eUsaoVExi5Rc614k",
            authDomain: "al-noor-islamic-academy.firebaseapp.com",
            projectId: "al-noor-islamic-academy",
            storageBucket: "al-noor-islamic-academy.firebasestorage.app",
            messagingSenderId: "571799539455",
            appId: "1:571799539455:web:d42728685908430296c6ca"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const signupForm = document.getElementById("signupForm");
        const signupButton = document.getElementById("signupButton");

        signupForm.addEventListener("submit", async (e) => {
            e.preventDefault();

            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const mobile = document.getElementById("mobile").value.trim();
            const language = document.getElementById("language").value;
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            if (!language) {
                alert("Please select your preferred language.");
                return;
            }

            if (password !== confirmPassword) {
                alert("Passwords do not match.");
                return;
            }

            if (password.length < 6) {
                alert("Password must be at least 6 characters.");
                return;
            }

            if (mobile.length < 10) {
                alert("Please enter a valid mobile number.");
                return;
            }

            signupButton.disabled = true;
            signupButton.textContent = "Creating Account...";

            try {
                const userCredential = await createUserWithEmailAndPassword(
                    auth,
                    email,
                    password
                );

                const user = userCredential.user;

                await updateProfile(user, {
                    displayName: name
                });

                // Save the student's profile in Firestore so the
                // mobile number is available on the payment page.
                await setDoc(doc(db, "students", user.uid), {
                    uid: user.uid,
                    name: name,
                    email: user.email || email,
                    mobile: mobile,
                    language: language,
                    createdAt: serverTimestamp()
                });

                alert(
                    "Account created successfully! Welcome to Al Noor Islamic Academy."
                );

                window.location.href = "dashboard.html";

            } catch (error) {
                console.error(error);

                if (error.code === "auth/email-already-in-use") {
                    alert(
                        "This email is already registered. Please login."
                    );
                }
                else if (error.code === "auth/invalid-email") {
                    alert(
                        "Please enter a valid email address."
                    );
                }
                else if (error.code === "auth/weak-password") {
                    alert(
                        "Password is too weak. Use at least 6 characters."
                    );
                }
                else {
                    alert(
                        "Signup failed: " + error.message
                    );
                }

                signupButton.disabled = false;
                signupButton.textContent = "Create Account";
            }
        });
    </script>
</body>
</html>
