<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sign Up - Al Noor Islamic Academy</title>


    <style>

*{margin:0;padding:0;box-sizing:border-box}
:root{--gold:#e8cb78;--gold-deep:#d4af37;--muted:#b8c9c0;--stroke:rgba(232,203,120,.28)}
html{min-height:100%;background:#04120d}
body{
 min-height:100vh;display:flex;justify-content:center;align-items:center;
 padding:24px 18px;font-family:Arial,sans-serif;color:#f8f7f0;
 background:
  radial-gradient(ellipse at 14% 7%,rgba(37,119,78,.27),transparent 34%),
  radial-gradient(ellipse at 92% 88%,rgba(196,153,57,.12),transparent 32%),
  linear-gradient(145deg,#030d09 0%,#071e15 52%,#0a2b1e 100%);
}
.signup-box{
 width:100%;max-width:460px;position:relative;isolation:isolate;overflow:hidden;
 padding:clamp(27px,5vw,39px) clamp(22px,6vw,36px);
 border-radius:28px;border:1px solid rgba(232,203,120,.34);
 background:linear-gradient(145deg,rgba(15,55,40,.97),rgba(6,29,20,.98));
 box-shadow:0 28px 75px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.07)
}
.signup-box:before{
 content:"";position:absolute;z-index:-1;width:230px;height:230px;right:-105px;top:-125px;
 border-radius:50%;background:radial-gradient(circle,rgba(232,203,120,.17),transparent 70%);
 box-shadow:0 0 0 24px rgba(232,203,120,.025),0 0 0 50px rgba(232,203,120,.018)
}
.signup-box:after{
 content:"";position:absolute;z-index:-1;left:0;right:0;top:0;height:4px;
 background:linear-gradient(90deg,#9b7423,#f6e4a0,#bd963b)
}
.logo{
 width:76px;height:76px;margin:0 auto 20px;display:flex;justify-content:center;align-items:center;
 border-radius:23px;transform:rotate(-4deg);
 background:linear-gradient(145deg,#ffedb0,#c69a38);color:#10251a;
 border:1px solid rgba(255,244,199,.8);font-size:24px;font-weight:800;
 box-shadow:0 0 0 7px rgba(212,175,55,.08),0 12px 28px rgba(0,0,0,.28)
}
h1{
 text-align:center;color:var(--gold);font-family:Georgia,"Times New Roman",serif;
 font-size:clamp(27px,6vw,32px);letter-spacing:-.3px;margin-bottom:9px
}
.subtitle{text-align:center;color:#bdcec4;font-size:14px;line-height:1.65;margin-bottom:27px}
.input-group{margin-bottom:16px}
label{display:block;color:#e6e9e2;font-size:13px;font-weight:700;letter-spacing:.2px;margin-bottom:8px}
input,select{
 width:100%;padding:14px 15px;background:rgba(3,19,13,.68);color:white;
 border:1px solid rgba(175,205,188,.25);border-radius:13px;font-size:15px;outline:none;
 transition:border-color .2s,box-shadow .2s,background .2s
}
input::placeholder{color:#82978b}
input:focus,select:focus{
 border-color:var(--gold);background:rgba(3,19,13,.9);
 box-shadow:0 0 0 4px rgba(212,175,55,.11)
}
select option{background:#071a17;color:white}
.signup-button{
 width:100%;padding:15px;margin-top:9px;border:1px solid rgba(255,238,174,.65);
 border-radius:13px;background:linear-gradient(135deg,#f1d987,#c69a35);
 color:#102319;font-size:16px;font-weight:800;letter-spacing:.2px;cursor:pointer;
 box-shadow:0 10px 24px rgba(0,0,0,.23);transition:transform .2s,filter .2s,box-shadow .2s
}
.signup-button:hover{filter:brightness(1.06);transform:translateY(-2px);box-shadow:0 14px 28px rgba(0,0,0,.3)}
.signup-button:active{transform:scale(.985)}
.signup-button:disabled{opacity:.6;cursor:wait;transform:none}
.login-text{text-align:center;margin-top:25px;color:#b4c3ba;font-size:14px;line-height:1.6}
.login-text a{color:var(--gold);text-decoration:none;font-weight:700}
.login-text a:hover{text-decoration:underline}
.home{display:block;text-align:center;margin-top:20px;color:#aabbb0;text-decoration:none;font-size:13px}
.home:hover{color:var(--gold)}
a:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
@media(max-width:480px){
 body{padding:17px 13px;align-items:flex-start}
 .signup-box{margin:auto 0;border-radius:23px;padding:27px 20px}
 .logo{width:68px;height:68px;border-radius:21px}
 .subtitle{margin-bottom:23px}
 input,select{padding:13px 14px}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important}}

    </style>

</head>


<body>


    <div class="signup-box">


        <div class="logo">
            AN
        </div>


        <h1>
            Create Account
        </h1>


        <p class="subtitle">
            Join Al Noor Islamic Academy
        </p>


        <form id="signupForm">


            <div class="input-group">

                <label>
                    Full Name
                </label>

                <input
                    id="name"
                    type="text"
                    placeholder="Enter your full name"
                    required>

            </div>


            <div class="input-group">

                <label>
                    Email Address
                </label>

                <input
                    id="email"
                    type="email"
                    placeholder="Enter your email"
                    required>

            </div>


            <div class="input-group">

                <label>
                    Mobile Number
                </label>

                <input
                    id="mobile"
                    type="tel"
                    placeholder="Enter mobile number"
                    required>

            </div>


            <div class="input-group">

                <label>
                    Password
                </label>

                <input
                    id="password"
                    type="password"
                    placeholder="Create password"
                    minlength="6"
                    required>

            </div>


            <div class="input-group">

                <label>
                    Confirm Password
                </label>

                <input
                    id="confirmPassword"
                    type="password"
                    placeholder="Confirm password"
                    minlength="6"
                    required>

            </div>


            <div class="input-group">
                <label for="language">Preferred Language *</label>
                <select id="language" name="language" required>
                    <option value="" disabled selected>Select your language</option>
                    <option value="Bengali">বাংলা (Bengali)</option>
                    <option value="Urdu">اردو (Urdu)</option>
                </select>
            </div>

            <button
                type="submit"
                class="signup-button"
                id="signupButton">

                Create Account

            </button>


        </form>


        <div class="login-text">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </div>


        <a href="index.html" class="home">
            ← Back to Home
        </a>


    </div>


    <script type="module">

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


        import {
            getAuth,
            createUserWithEmailAndPassword,
            updateProfile
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

        import {
            getFirestore,
            doc,
            setDoc,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


        const firebaseConfig = {

            apiKey: "AIzaSyBvugRPCyDcq0gJsE_eUsaoVExi5Rc614k",

            authDomain: "al-noor-islamic-academy.firebaseapp.com",

            projectId: "al-noor-islamic-academy",

            storageBucket: "al-noor-islamic-academy.firebasestorage.app",

            messagingSenderId: "571799539455",

            appId: "1:571799539455:web:d42728685908430296c6ca"

        };


        const app = initializeApp(firebaseConfig);

        const auth = getAuth(app);
        const db = getFirestore(app);


        const signupForm =
            document.getElementById("signupForm");


        const signupButton =
            document.getElementById("signupButton");


        signupForm.addEventListener("submit", async (e) => {

            e.preventDefault();


            const name =
                document.getElementById("name").value.trim();


            const email =
                document.getElementById("email").value.trim();


            const mobile =
                document.getElementById("mobile").value.trim();

            const language =
                document.getElementById("language").value;


            const password =
                document.getElementById("password").value;


            const confirmPassword =
                document.getElementById("confirmPassword").value;


            if (!language) {
                alert("Please select your preferred language.");
                return;
            }

            if (password !== confirmPassword) {

                alert("Passwords do not match.");

                return;

            }


            if (password.length < 6) {

                alert("Password must be at least 6 characters.");

                return;

            }


            if (mobile.length < 10) {

                alert("Please enter a valid mobile number.");

                return;

            }


            signupButton.disabled = true;

            signupButton.textContent = "Creating Account...";


            try {

                const userCredential =
                    await createUserWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );


                const user =
                    userCredential.user;


                await updateProfile(user, {

                    displayName: name

                });

                // Save the student's profile in Firestore so the
                // mobile number is available on the payment page.
                await setDoc(doc(db, "students", user.uid), {
                    uid: user.uid,
                    name: name,
                    email: user.email || email,
                    mobile: mobile,
                    language: language,
                    createdAt: serverTimestamp()
                });


                alert(
                    "Account created successfully! Welcome to Al Noor Islamic Academy."
                );


                window.location.href =
                    "dashboard.html";


            } catch (error) {

                console.error(error);


                if (error.code === "auth/email-already-in-use") {

                    alert(
                        "This email is already registered. Please login."
                    );

                }

                else if (error.code === "auth/invalid-email") {

                    alert(
                        "Please enter a valid email address."
                    );

                }

                else if (error.code === "auth/weak-password") {

                    alert(
                        "Password is too weak. Use at least 6 characters."
                    );

                }

                else {

                    alert(
                        "Signup failed: " + error.message
                    );

                }


                signupButton.disabled = false;

                signupButton.textContent =
                    "Create Account";

            }

        });

    </script>


</body>

</html>
