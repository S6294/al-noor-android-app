
name: Build Al Noor Android AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Prepare website files
        run: |
          mkdir -p www assets
          cp ./*.html www/
          cp app-icon.png www/app-icon.png
          cp app-icon.png assets/icon.png

          if [ -f firebase-messaging-sw.js ]; then
            cp firebase-messaging-sw.js www/
          fi

          if [ -d images ]; then
            cp -R images www/
          fi

          cat > package.json <<'EOF'
          {
            "name": "al-noor-android",
            "version": "1.0.0",
            "private": true
          }
          EOF

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "in.alnoorislamicacademy.app",
            "appName": "Al Noor Islamic Academy",
            "webDir": "www"
          }
          EOF

          cat > www/manifest.json <<'EOF'
          {
            "name": "Al Noor Islamic Academy",
            "short_name": "Al Noor Academy",
            "start_url": "/",
            "display": "standalone",
            "background_color": "#071c16",
            "theme_color": "#071c16"
          }
          EOF

      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/android
          npm install --save-dev @capacitor/cli @capacitor/assets

      - name: Add Android platform
        run: npx cap add android

      - name: Enable Android Back Navigation
        run: |
          mkdir -p android/app/src/main/java/in/alnoorislamicacademy/app

          cat > android/app/src/main/java/in/alnoorislamicacademy/app/MainActivity.java <<'EOF'
          package in.alnoorislamicacademy.app;

          import android.os.Bundle;
          import androidx.activity.OnBackPressedCallback;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getOnBackPressedDispatcher().addCallback(
                      this,
                      new OnBackPressedCallback(true) {
                          @Override
                          public void handleOnBackPressed() {
                              if (getBridge() != null &&
                                  getBridge().getWebView() != null &&
                                  getBridge().getWebView().canGoBack()) {
                                  getBridge().getWebView().goBack();
                              } else {
                                  setEnabled(false);
                                  getOnBackPressedDispatcher().onBackPressed();
                              }
                          }
                      }
                  );
              }
          }
          EOF

      - name: Generate Android app icons
        run: npx capacitor-assets generate --android --iconBackgroundColor '#071c16' --splashBackgroundColor '#071c16'

      - name: Sync web assets
        run: npx cap sync android

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 secret is missing"
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks

          test -s android/upload-keystore.jks

      - name: Configure release signing
        run: |
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile rootProject.file("upload-keystore.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Build signed Release AAB
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: Al-Noor-Android-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
