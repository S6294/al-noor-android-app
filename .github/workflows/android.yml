
name: Build Al Noor Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Create Capacitor Project
        run: |
          mkdir -p www
          cp *.html www/
          cp firebase-messaging-sw.js www/ || true

          cat > package.json <<'EOF'
          {
            "name": "al-noor-android",
            "version": "1.0.0",
            "private": true
          }
          EOF

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "in.alnoorislamicacademy.app",
            "appName": "Al Noor Islamic Academy",
            "webDir": "www"
          }
          EOF

          cat > www/manifest.json <<'EOF'
          {
            "name": "Al Noor Islamic Academy",
            "short_name": "Al Noor Academy",
            "start_url": "/",
            "display": "standalone",
            "background_color": "#071c16",
            "theme_color": "#071c16"
          }
          EOF

      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/android
          npm install -D @capacitor/cli

      - name: Add Android Platform
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Al-Noor-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
