
name: Build Al Noor Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "al-noor-android-app-starter.zip"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Extract Project
        run: unzip -q al-noor-android-app-starter.zip

      - name: Install Dependencies
        working-directory: al-noor-android-app
        run: npm install

      - name: Add Android Platform
        working-directory: al-noor-android-app
        run: npx cap add android

      - name: Sync Android
        working-directory: al-noor-android-app
        run: npx cap sync android

      - name: Build APK
        working-directory: al-noor-android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Al-Noor-Android-APK
          path: al-noor-android-app/android/app/build/outputs/apk/debug/app-debug.apk
