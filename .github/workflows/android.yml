name: Build Al Noor Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Prepare website files
        run: |
          mkdir -p www assets
          cp ./*.html www/
          cp app-icon.png www/app-icon.png
          cp app-icon.png assets/icon.png
          if [ -f firebase-messaging-sw.js ]; then
            cp firebase-messaging-sw.js www/
          fi
          if [ -d images ]; then
            cp -R images www/
          fi

          cat > package.json <<'EOF'
          {
            "name": "al-noor-android",
            "version": "1.0.0",
            "private": true
          }
          EOF

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "in.alnoorislamicacademy.app",
            "appName": "Al Noor Islamic Academy",
            "webDir": "www"
          }
          EOF

          cat > www/manifest.json <<'EOF'
          {
            "name": "Al Noor Islamic Academy",
            "short_name": "Al Noor Academy",
            "start_url": "/",
            "display": "standalone",
            "background_color": "#071c16",
            "theme_color": "#071c16"
          }
          EOF

      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/android
          npm install --save-dev @capacitor/cli @capacitor/assets

      - name: Add Android platform
        run: npx cap add android

      - name: Generate Android app icons
        run: npx capacitor-assets generate --android --iconBackgroundColor '#071c16' --splashBackgroundColor '#071c16'

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Al-Noor-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
                - name: Enable Android Back Navigation
        run: |
          mkdir -p android/app/src/main/java/in/alnoorislamicacademy/app

          cat > android/app/src/main/java/in/alnoorislamicacademy/app/MainActivity.java <<'EOF'
          package in.alnoorislamicacademy.app;

          import android.os.Bundle;
          import androidx.activity.OnBackPressedCallback;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getOnBackPressedDispatcher().addCallback(
                      this,
                      new OnBackPressedCallback(true) {
                          @Override
                          public void handleOnBackPressed() {
                              if (getBridge() != null &&
                                  getBridge().getWebView() != null &&
                                  getBridge().getWebView().canGoBack()) {
                                  getBridge().getWebView().goBack();
                              } else {
                                  setEnabled(false);
                                  getOnBackPressedDispatcher().onBackPressed();
                              }
                          }
                      }
                  );
              }
          }
          EOF
